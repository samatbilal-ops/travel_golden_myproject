services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=myproject1.settings
      - POSTGRES_DB=traveldb
      - POSTGRES_USER=traveluser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-travelpass123}
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=traveldb
      - POSTGRES_USER=traveluser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-travelpass123}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveluser -d traveldb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  media_data:
